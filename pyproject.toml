[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "mcinst"
version = "0.1.0"
description = "Minecraft instance downloader and installer (early development)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["httpx>=0.28,<0.29", "pydantic>=2.11,<3"]

[project.scripts]
mcinst = "mcinst.cli:main"

[dependency-groups]
dev = ["ruff>=0.11,<1"]

[tool.hatch.build.targets.wheel]
packages = ["src/mcinst"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
